        <input type="text" id="delivery-city" name="delivery-city"><br><br>

        <input type="text" id="delivery-zip" name="delivery-zip"><br><br>

        <input type="checkbox" id="same-as-delivery" name="same-as-delivery">
        
        <div id="billing-address-fields">
		
            <h2>Billing Address</h2>
            <label for="billing-name">Name:</label>
            <input type="text" id="billing-name" name="billing-name"><br><br>

        </div>

            <div>

            <div>
                <label for="payment-method">Payment Method:</label>
                <label for="pay-on-pickup">Pay on Pickup</label>
                <input type="radio" id="pay-on-pickup" name="payment-method" value="pickup" onclick="toggleCreditCardInfo()" required>
                <label for="pay-online">Pay Online</label>
				<input type="radio" id="pay-online" name="payment-method" value="online" onclick="toggleCreditCardInfo()" required>
            </div>
			<div id="credit-card-info" style="display: none;">

				<select id="card-type" name="card-type" required>

					<option value="visa">Visa</option>
					<option value="mastercard">MasterCard</option>
					<option value="amex">American Express</option>
    </select>
    
    <label for="card-number">Credit Card Number:</label>
    <input type="text" id="card-number" name="card-number" placeholder="1234 5678 9012 3456" required>
    
    <label for="expiry-date">Expiry Date:</label>
    <input type="text" id="expiry-date" name="expiry-date" placeholder="MM/YY" required>
    
    <label for="cvv">CVV:</label>
    <input type="text" id="cvv" name="cvv" required>
</div>
